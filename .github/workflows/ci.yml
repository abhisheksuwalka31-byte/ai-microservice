name: CI Pipeline - AI Microservice

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Test, Lint & Verify Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic Migrations
        run: |
          alembic upgrade head

      - name: Run Pytest with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Container
        run: |
          docker build -t ai-microservice:latest .
